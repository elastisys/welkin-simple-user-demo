{{- if .Values.ingress.gateway.enabled -}}
{{- $fullName := include "welkin-user-demo.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "welkin-user-demo.labels" . | nindent 4 }}

  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.gateway }}
  parentRefs:
    - kind: Gateway
      name: {{ .name | quote }}
      {{- with .namespace }}
      namespace: {{ . | quote }}
      {{- end }}
  {{- end }}
  rules:
    - name: root
      backendRefs:
        - name: {{ $fullName | quote }}
          port: {{ $svcPort }}
      matches:
        - path:
            value: /
      {{- with .Values.ingress.middlewares }}
      {{ $anyMiddlewareEnabled := false }}
      {{- range $_, $config := . }}
        {{- $anyMiddlewareEnabled = true }}
      {{- end }}
      {{ if $anyMiddlewareEnabled  }}
      filters:
        {{- range $name, $config := . }}
          {{- if $config.enabled }}
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: {{ $name }}
          {{- end }}
        {{- end }}
      {{- end }}
      {{- end }}
{{- end }}
